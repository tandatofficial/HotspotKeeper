name: Build HotspotKeeper IPA (TrollStore iOS 15+)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Compile HotspotKeeper App (SwiftUI & IOKit & MobileWiFi)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/HotspotKeeper.app

          # Compile Swift sources into arm64 iOS 15 executable
          xcrun -sdk iphoneos swiftc -O \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -emit-executable \
            HotspotKeeperApp.swift \
            HotspotEngine.swift \
            ContentView.swift \
            -o Payload/HotspotKeeper.app/HotspotKeeper \
            -framework UIKit \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework Foundation

          # Copy Info.plist
          cp Info.plist Payload/HotspotKeeper.app/Info.plist

          # Sign with TrollStore root & MobileWiFi entitlements
          ldid -Sentitlements.plist Payload/HotspotKeeper.app/HotspotKeeper

          # Package into IPA
          zip -r9 HotspotKeeper_TrollStore_iOS15.ipa Payload
          ls -lh HotspotKeeper_TrollStore_iOS15.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotspotKeeper-TrollStore-iOS15-IPA
          path: HotspotKeeper_TrollStore_iOS15.ipa

      - name: Release IPA directly on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "HotspotKeeper v1.1.0 - Ép Tự Động Bật & Chống Rớt Sóng (TrollStore)"
          body: |
            ### 📡 HotspotKeeper v1.1.0 (Auto-Force & Anti-Flicker Edition)
            Bản nâng cấp mạnh mẽ cho iOS 15.4 (iPhone 11) TrollStore:

            #### 🚀 Các nâng cấp mới trong v1.1.0:
            1. **Tự Động Ép Bật Phần Cứng Hotspot:** Tích hợp trực tiếp `MobileWiFi.framework` (`WiFiManagerClientSetMISState`) và quyền `com.apple.wifi.manager-access`, tự kích hoạt modem phát Hotspot khi ấn nút.
            2. **Discovery Beacon Loop (3s/lần):** Liên tục phát tín hiệu `WiFiManagerClientSetMISDiscoveryState(1)`, ngăn chặn hoàn toàn việc iOS ẩn SSID khiến máy tính bị mất sóng.
            3. **Khóa 2 tầng Power Management:** Kích hoạt đồng thời cả `PreventSystemSleep` và `PreventUserIdleSystemSleep`.
            4. **4G Cellular Heartbeat:** Định kỳ tạo luồng dữ liệu 4G nhẹ để trạm phát sóng nhà mạng không đưa kết nối vào trạng thái ngủ đông (RRC Idle).
            5. **Chống chập chờn:** Hướng dẫn bật 'Tối đa hóa tương thích' (băng tần 2.4GHz) cho iPhone 11.
          files: HotspotKeeper_TrollStore_iOS15.ipa
