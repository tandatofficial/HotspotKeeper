name: Build HotspotKeeper IPA (TrollStore iOS 15+)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Compile HotspotKeeper App (SwiftUI & IOKit)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/HotspotKeeper.app

          # Compile Swift sources into arm64 iOS 15 executable
          xcrun -sdk iphoneos swiftc -O \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -emit-executable \
            HotspotKeeperApp.swift \
            HotspotEngine.swift \
            ContentView.swift \
            -o Payload/HotspotKeeper.app/HotspotKeeper \
            -framework UIKit \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework Foundation

          # Copy Info.plist
          cp Info.plist Payload/HotspotKeeper.app/Info.plist

          # Sign with TrollStore root entitlements
          ldid -Sentitlements.plist Payload/HotspotKeeper.app/HotspotKeeper

          # Package into IPA
          zip -r9 HotspotKeeper_TrollStore_iOS15.ipa Payload
          ls -lh HotspotKeeper_TrollStore_iOS15.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotspotKeeper-TrollStore-iOS15-IPA
          path: HotspotKeeper_TrollStore_iOS15.ipa

      - name: Release IPA directly on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "HotspotKeeper v1.0.0 - iOS 15.4 TrollStore"
          body: |
            ### 📡 HotspotKeeper v1.0.0 (TrollStore Edition)
            Ứng dụng giữ kết nối Điểm truy cập cá nhân (Personal Hotspot) phát Wi-Fi liên tục 24/7 không bao giờ ngắt trên iOS 15.4 (iPhone 11).

            #### 🚀 Các tính năng chính:
            - **IOKit Power Assertion**: Duy trì CPU & Wi-Fi Chip luôn hoạt động, chặn Apple `powerd` deep-sleep.
            - **Silent Audio Engine**: Giữ tiến trình app sống vĩnh viễn ngầm trong nền.
            - **UDP Keep-Alive Packet Generator**: Định kỳ gửi heartbeat qua subnet `172.20.10.x` để iOS không ngắt mạng do nhàn rỗi.
            - **Chế độ OLED Màn hình đen**: Chạm đúp để tắt sáng màn hình khi cắm sạc phát Wi-Fi cả ngày lẫn đêm.

            #### 📲 Hướng dẫn cài đặt:
            1. Tải trực tiếp file `HotspotKeeper_TrollStore_iOS15.ipa` bên dưới bằng Safari.
            2. Bấm nút Chia sẻ (Share) -> Chọn **TrollStore**.
            3. Mở app, bật Hotspot trong Cài đặt iPhone rồi bấm **BẬT GIỮ PHÁT**.
          files: HotspotKeeper_TrollStore_iOS15.ipa
